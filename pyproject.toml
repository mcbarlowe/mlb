[project]
name = "mlb"
version = "0.1.0"
description = "MLB Stats API ETL and modeling pipeline"
readme = "README.md"
requires-python = ">=3.11.4"
dependencies = [
    "aiofiles>=24.1.0",
    "catboost>=1.2.8",
    "httpx>=0.27.0",
    "jupyter>=1.1.1",
    "pandas>=2.3.1",
    "pandas-stubs==2.3.0.250703",
    "mlflow>=2.17.0",
    "numpy<2",
    "polars>=1.32.3",
    "psycopg[binary]>=3.2.9",
    "pyarrow>=21.0.0",
    "requests>=2.32.4",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.2",
    "torch>=2.0.0,<2.3.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "atproto>=0.0.55",
    "tqdm>=4.67.1",
    "playwright>=1.62.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "black[d]>=25.1.0",
    "pytest>=8.4.1",
    "ruff>=0.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
norecursedirs = [".venv", "models", "output", "catboost_info", "notebooks"]
python_files = ["test_*.py"]
testpaths = ["."]

[tool.ruff]
extend-exclude = [".idea", "catboost_info", "models", "notebooks", "output"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]
